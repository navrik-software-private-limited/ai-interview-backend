name: Test

# ai-interview-backend has no existing deploy workflow to interact with —
# this is a standalone check on GitHub-hosted runners only. It never runs on
# the production EC2 host and never triggers or gates a deploy.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-interview-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ai-interview-backend/package-lock.json

      - run: npm ci

      # Mocked unit + integration suite only — no live LLM/STT/TTS/DB/Redis
      # calls, so no secrets or external services are required here.
      - run: npm test
